name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'packages/backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy-digitalocean:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check if DigitalOcean secrets are available
        id: check-secrets
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          DIGITALOCEAN_APP_NAME: ${{ secrets.DIGITALOCEAN_APP_NAME }}
        run: |
          if [ -z "$DIGITALOCEAN_ACCESS_TOKEN" ] || [ -z "$DIGITALOCEAN_APP_NAME" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "DigitalOcean secrets not configured, skipping deployment"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Setup Node.js
        if: steps.check-secrets.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        if: steps.check-secrets.outputs.skip != 'true'
        run: npm ci

      - name: Generate Prisma Client
        if: steps.check-secrets.outputs.skip != 'true'
        run: npm run db:generate
        working-directory: packages/backend

      - name: Build Backend
        if: steps.check-secrets.outputs.skip != 'true'
        run: npm run build
        working-directory: packages/backend

      - name: Deploy to DigitalOcean
        if: steps.check-secrets.outputs.skip != 'true'
        uses: digitalocean/app_action@v1
        with:
          app_name: ${{ secrets.DIGITALOCEAN_APP_NAME }}
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

  deploy-render:
    name: Deploy to Render
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check if Render secrets are available
        id: check-secrets
        env:
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -z "$RENDER_SERVICE_ID" ] || [ -z "$RENDER_API_KEY" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Render secrets not configured, skipping deployment"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Setup Node.js
        if: steps.check-secrets.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        if: steps.check-secrets.outputs.skip != 'true'
        run: npm ci

      - name: Generate Prisma Client
        if: steps.check-secrets.outputs.skip != 'true'
        run: npm run db:generate
        working-directory: packages/backend

      - name: Build Backend
        if: steps.check-secrets.outputs.skip != 'true'
        run: npm run build
        working-directory: packages/backend

      - name: Deploy to Render
        if: steps.check-secrets.outputs.skip != 'true'
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}
