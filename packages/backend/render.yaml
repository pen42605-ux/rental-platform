# Render Blueprint for Backend Deployment
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: rental-platform-backend
    env: node
    region: singapore  # 或選擇其他區域: oregon, frankfurt, etc.
    plan: starter  # starter, standard, pro
    buildCommand: npm ci && npm run db:generate && npm run build
    startCommand: npm start
    rootDir: packages/backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: rental-platform-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: FRONTEND_URL
        sync: false  # 需要手動設定
      - key: CORS_ORIGINS
        sync: false  # 需要手動設定

databases:
  - name: rental-platform-db
    databaseName: rental_platform
    user: rental_user
    plan: starter  # starter, standard, pro





